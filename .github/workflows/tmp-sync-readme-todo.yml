name: tmp-sync-readme-todo
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main reference
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Scan Python files and update README TODOs
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def extract_todos(path: Path):
              pattern = re.compile(r'^\s*#\s*TODO\b\s*(.*)$')
              todos = []
              with path.open("r", encoding="utf-8", errors="replace") as fh:
                  for lineno, raw_line in enumerate(fh, 1):
                      line = raw_line.rstrip("\r\n")
                      m = pattern.match(line)
                      if not m:
                          continue

                      rest = m.group(1).strip()
                      if rest.startswith(":"):
                          rest = rest[1:].lstrip()

                      owner = None
                      owner_match = re.match(r"^\(([^)]+)\)\s*(.*)$", rest)
                      if owner_match:
                          owner = owner_match.group(1)
                          rest = owner_match.group(2).strip()

                      if owner:
                          message = f"({owner}) {rest}".rstrip()
                      else:
                          message = rest.rstrip()
                      todos.append((lineno, message))

              todos.sort(key=lambda item: item[0])
              return todos

          all_python_todos = {}
          for root, dirnames, filenames in os.walk("."):
              if ".git" in dirnames:
                  dirnames.remove(".git")
              for filename in filenames:
                  if filename.endswith(".py"):
                      rel_path = Path(root, filename).as_posix()
                      all_python_todos[rel_path] = extract_todos(Path(root, filename))

          changed_python_files = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD", "--", "*.py"],
              text=True,
          ).splitlines()
          print("Changed Python files:", changed_python_files)

          def replace_file_entries(text: str, filepath: str, todos):
              block_pattern = re.compile(
                  r"(?:^- \[ \] \*\*" + re.escape(filepath) + r":\d+\*\* - [^\n]*\n)+",
                  re.MULTILINE,
              )
              matches = list(block_pattern.finditer(text))
              if len(matches) != 1:
                  raise RuntimeError(
                      f"Expected one contiguous README TODO block for {filepath}, "
                      f"found {len(matches)}"
                  )

              match = matches[0]
              replacement = "".join(
                  f"- [ ] **{filepath}:{lineno}** - {message}\n"
                  for lineno, message in todos
              )
              return text[:match.start()] + replacement + text[match.end():]

          readme_path = Path("README.md")
          readme_text = readme_path.read_text(encoding="utf-8")

          for filepath in changed_python_files:
              if not filepath.endswith(".py"):
                  continue
              todos = all_python_todos.get(filepath, [])
              readme_text = replace_file_entries(readme_text, filepath, todos)
              print(f"{filepath}: {len(todos)} TODO(s) found")

          readme_path.write_text(readme_text, encoding="utf-8")
          PY

      - name: Remove temporary files, commit, and push
        if: always()
        run: |
          set -euo pipefail

          git rm -f --ignore-unmatch .github/workflows/tmp-sync-readme-todo.yml
          git rm -f --ignore-unmatch .tmp-write-test
          git add README.md

          git config user.name "TempestDaggerDone"
          git config user.email "317157964+TempestDaggerDone@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update Complete TODO List on dev"
            git push origin HEAD:dev
          fi

          git push origin --delete tmp-write-probe || true
